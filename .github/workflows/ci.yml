name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loyalflow:ci .
      - run: |
          docker run -d --name lf -e LOYALFLOW_DEMO=1 -p 3000:3000 loyalflow:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/health
